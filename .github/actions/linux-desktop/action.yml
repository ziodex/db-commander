name: Prepare Linux desktop tests
description: Install a private display, window manager, credential-store and optional packaging tools
inputs:
  packaging:
    description: Install DEB, RPM and AppImage packaging dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INSTALL_PACKAGING: ${{ inputs.packaging }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y dbus-x11 gnome-keyring libglib2.0-bin xvfb xauth openbox x11-utils libgtk-3-0t64
        pnpm exec playwright install-deps chromium
        if [[ "$INSTALL_PACKAGING" == true ]]; then
          sudo apt-get install -y rpm libnotify4 libsecret-1-0 libxss1 libxtst6 xdg-utils
          # AppRun probes user namespaces and otherwise silently adds --no-sandbox.
          # Ubuntu 24.04 restricts this probe through AppArmor. Enable namespaces
          # only on disposable hosted runners; the installed Electron sandbox
          # remains required and is checked by the lifecycle tests.
          if ! unshare -Ur true; then
            test "${GITHUB_ACTIONS:-}" = true
            test "${RUNNER_ENVIRONMENT:-}" = github-hosted
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare -Ur true
          fi
        fi

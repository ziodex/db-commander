name: Set up Db Commander
description: Install the pinned toolchain and native dependencies from the lockfile
runs:
  using: composite
  steps:
    # Reads the pinned pnpm version from package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: pnpm
    - name: Install dependencies and prepare report directories
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        node --version
        pnpm --version
        pnpm install --frozen-lockfile
        node -e "for (const path of ['test-results', '.test-artifacts/ci-results']) require('node:fs').mkdirSync(path, { recursive: true })"

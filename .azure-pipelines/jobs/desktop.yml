parameters:
  - name: startupOnly
    type: boolean
    default: false
  - name: installerChecks
    type: boolean
    default: true
  - name: name
    type: string
  - name: arch
    type: string
    default: x64
  - name: vmImage
    type: string
    default: ''
  - name: pool
    type: string
    default: ''

jobs:
  - job: ${{ parameters.name }}
    displayName: Native desktop ${{ parameters.name }}
    timeoutInMinutes: 90
    pool:
      ${{ if ne(parameters.vmImage, '') }}:
        vmImage: ${{ parameters.vmImage }}
      ${{ else }}:
        name: ${{ parameters.pool }}
        demands:
          - Agent.OS -equals Darwin
          - Agent.OSArchitecture -equals ARM64
    steps:
      - template: ../steps/setup.yml
      - pwsh: node scripts/check-release.mjs --arch ${{ parameters.arch }}
        displayName: Require the native target architecture
      - template: ../steps/linux-desktop.yml
      - template: ../steps/installer-tools.yml
      - powershell: Set-DisplayResolution -Width 1920 -Height 1080 -Force
        displayName: Prepare Windows display for native window resize tests
        condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))
      - pwsh: pnpm exec vitest run tests/unit --reporter=default --reporter=junit --outputFile.junit=.test-artifacts/ci-results/unit.xml
        displayName: Unit tests
      - pwsh: pnpm package
        displayName: Typecheck, build and package the native application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - bash: bash scripts/with-test-keyring.sh node scripts/with-test-desktop.mjs node scripts/smoke-package.mjs
        displayName: Packaged desktop tests with a private Linux credential store
        condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
      - pwsh: node scripts/smoke-package.mjs
        displayName: Packaged desktop tests with the native credential store
        condition: and(succeeded(), ne(variables['Agent.OS'], 'Linux'))
        env:
          SQLCOMMANDER_STARTUP_ONLY: ${{ parameters.startupOnly }}
      - ${{ if parameters.installerChecks }}:
        - pwsh: |
            $PSNativeCommandUseErrorActionPreference = $true
            node scripts/build-release.mjs --fixture --arch ${{ parameters.arch }}
            node scripts/build-release.mjs --arch ${{ parameters.arch }}
          displayName: Build unsigned installers and a different-version upgrade fixture
        - template: ../steps/installers.yml
      - template: ../steps/test-results.yml
        parameters:
          name: desktop-$(Agent.OS)-${{ parameters.arch }}
      - ${{ if parameters.installerChecks }}:
        - pwsh: node scripts/stage-release.mjs --output "$(Build.ArtifactStagingDirectory)/installers"
          displayName: Select only tested installers, checksums and lifecycle reports
        - task: PublishPipelineArtifact@1
          displayName: Publish tested unsigned installers
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/installers'
            artifact: 'SQLCommander-unsigned-$(Agent.OS)-${{ parameters.arch }}'

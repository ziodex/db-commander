steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    persistCredentials: false
  - task: UseNode@1
    displayName: Use Node.js $(NODE_VERSION)
    inputs:
      version: '$(NODE_VERSION)'
  # PowerShell 7 keeps Windows commands in the native Windows environment;
  # Azure's Bash task can select WSL and bypass the Windows Node installation.
  - pwsh: |
      $PSNativeCommandUseErrorActionPreference = $true
      corepack enable
      corepack prepare "pnpm@$env:SQLCOMMANDER_PNPM_VERSION" --activate
      node --version
      pnpm --version
      node -e "for (const directory of ['test-results', '.test-artifacts/ci-results']) require('node:fs').mkdirSync(directory, { recursive: true })"
    displayName: Activate the pinned pnpm version and prepare test output
    env:
      SQLCOMMANDER_PNPM_VERSION: $(PNPM_VERSION)
  - task: Cache@2
    displayName: Cache the pnpm package store
    inputs:
      key: '"pnpm" | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "$(NODE_VERSION)" | "$(PNPM_VERSION)" | pnpm-lock.yaml'
      restoreKeys: |
        "pnpm" | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "$(NODE_VERSION)" | "$(PNPM_VERSION)"
      path: '$(PNPM_STORE_PATH)'
  - pwsh: pnpm install --frozen-lockfile --store-dir "$env:SQLCOMMANDER_PNPM_STORE"
    displayName: Install dependencies, including native optional packages
    env:
      SQLCOMMANDER_PNPM_STORE: $(PNPM_STORE_PATH)
